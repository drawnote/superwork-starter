# 공격 시나리오 (BREAK) — 여러분의 World가 막아야 하는 일을 "일어나게" 시도합니다.
# 형식과 desk-check 방법: scenarios/README.md · 기록: assignment/break-fix.md
# 판정은 예측(PREDICTION)입니다. 리뷰에서 강사가 실제 Runtime 결과와 비교합니다.
scenario:
  name: submit-by-someone-else
  kind: adversarial
  record: R-1001
  protects: "Only the requester can submit their own request."
  steps:
    - input: "Submit request R-1001."
      as: blake                   # 요청자가 아닌 다른 employee
      transition: submit
      expect: DENY                # 여러분의 예측 — 틀려도 괜찮습니다
      because: >
        State: R-1001 is draft = submit.from.
        Role: blake has employee = submit.principal_role.
        Guard C1_requester_only: principal.id (blake) == request.requester (alex) → false → DENY.
